services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasktracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tasktracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: localhost/tasktracker-app:latest
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-tasktracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tasktracker}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  web:
    image: localhost/tasktracker-web:latest
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    networks:
      default:
      edge:
        aliases:
          - tasktracker-web

networks:
  edge:
    external: true

volumes:
  pgdata:
